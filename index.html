<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Gastos Diarios</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 16px; padding-bottom: 40px; }
        .container { max-width: 480px; margin: 0 auto; }
        
        /* Cabecera y Presupuesto */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .header h1 { font-size: 1.3rem; margin: 0; }
        .header-buttons { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
        .btn-small { background: none; border: 1px solid var(--border); padding: 5px 8px; border-radius: 8px; font-size: 0.75rem; color: var(--muted); cursor: pointer; }
        
        .summary-card { background: var(--card); border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
        .total-label { font-size: 0.85rem; color: var(--muted); }
        .total-amount { font-size: 2.2rem; font-weight: 700; margin: 4px 0 12px 0; }
        
        .progress-bg { background: var(--border); height: 10px; border-radius: 99px; overflow: hidden; margin-bottom: 8px; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s, background 0.3s; }
        .budget-info { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--muted); }
        
        /* Formulario */
        .card { background: var(--card); border-radius: 16px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); margin-bottom: 16px; }
        .input-group { margin-bottom: 14px; }
        .input-amount { width: 100%; font-size: 1.8rem; font-weight: 700; padding: 12px; border: 2px solid var(--border); border-radius: 12px; text-align: center; outline: none; }
        .input-amount:focus { border-color: var(--primary); }
        
        .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
        .cat-btn { background: var(--bg); border: 2px solid transparent; border-radius: 12px; padding: 10px 4px; text-align: center; cursor: pointer; transition: all 0.2s; position: relative; }
        .cat-btn.active { border-color: var(--primary); background: #eff6ff; font-weight: 600; }
        .cat-btn.add-cat { border: 2px dashed var(--border); background: transparent; color: var(--muted); }
        .cat-icon { font-size: 1.4rem; display: block; margin-bottom: 4px; }
        .cat-name { font-size: 0.72rem; display: block; line-height: 1.1; }

        /* Subcategorías */
        .subcat-container { background: #f1f5f9; padding: 10px; border-radius: 10px; margin-bottom: 14px; display: none; }
        .subcat-container.open { display: block; }
        .subcat-label { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; display: block; }
        .subcat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .subcat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer; }
        .subcat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .row-inputs { display: flex; gap: 8px; margin-bottom: 14px; }
        .input-text, .input-date { padding: 10px; border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; outline: none; background: white; }
        .input-text { flex: 2; }
        .input-date { flex: 1; }
        
        .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-submit:active { opacity: 0.9; }

        /* Pestañas */
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: var(--card); border-radius: 10px; font-size: 0.9rem; font-weight: 600; color: var(--muted); cursor: pointer; border: 1px solid var(--border); }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Listas */
        .expense-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .expense-item:last-child { border-bottom: none; }
        .exp-left { display: flex; align-items: center; gap: 10px; }
        .exp-icon { font-size: 1.4rem; background: var(--bg); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 10px; }
        .exp-title { font-weight: 600; font-size: 0.9rem; }
        .exp-sub { font-size: 0.75rem; color: var(--muted); }
        .exp-right { text-align: right; display: flex; align-items: center; gap: 10px; }
        .exp-amount { font-weight: 700; font-size: 0.95rem; }
        .btn-del { background: none; border: none; color: var(--danger); font-size: 1.1rem; cursor: pointer; padding: 4px; }

        /* Desglose */
        .cat-stat { margin-bottom: 12px; }
        .cat-stat-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; font-weight: 500; }
        .stat-bar-bg { background: var(--bg); height: 8px; border-radius: 99px; overflow: hidden; }
        .stat-bar-fill { background: var(--primary); height: 100%; }
        .subcat-stat-list { margin-left: 20px; margin-top: 4px; font-size: 0.8rem; color: var(--muted); }

        /* Modal Categorías / Subcategorías */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); z-index: 100; align-items: center; justify-content: center; padding: 16px; }
        .modal-overlay.open { display: flex; }
        .modal-box { background: var(--card); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); max-height: 90vh; overflow-y: auto; }
        .modal-title { font-size: 1.1rem; font-weight: 700; margin: 0 0 14px 0; display: flex; justify-content: space-between; align-items: center; }
        .emoji-presets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 14px 0; }
        .emoji-chip { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 1.2rem; cursor: pointer; }
        .modal-actions { display: flex; gap: 8px; margin-top: 12px; }
        
        .cat-management-list { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 12px; }
        .cat-manage-item { background: var(--bg); border-radius: 10px; padding: 10px; margin-bottom: 8px; }
        .cat-manage-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; }
        .subcat-tags-inline { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
        .subcat-tag-badge { background: white; border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; font-size: 0.75rem; display: flex; align-items: center; gap: 4px; }
        .subcat-tag-badge button { border: none; background: none; color: var(--danger); font-weight: bold; cursor: pointer; padding: 0; font-size: 0.8rem; }
        
        .add-subcat-row { display: flex; gap: 6px; }
        .add-subcat-row input { flex: 1; padding: 6px 8px; font-size: 0.8rem; border: 1px solid var(--border); border-radius: 6px; outline: none; background: white; }
        .add-subcat-row button { background: var(--primary); color: white; border: none; border-radius: 6px; padding: 6px 10px; font-size: 0.75rem; cursor: pointer; font-weight: 600; }
    </style>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="monthTitle">Gastos del Mes</h1>
        <div class="header-buttons">
            <button class="btn-small" onclick="setBudget()">🎯 Límite</button>
            <button class="btn-small" onclick="exportBackup()">💾 Guardar</button>
            <button class="btn-small" onclick="document.getElementById('importFile').click()">📂 Cargar</button>
            <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
        </div>
    </div>

    <div class="summary-card">
        <div class="total-label">Total gastado este mes</div>
        <div class="total-amount" id="totalSpent">0,00 €</div>
        <div class="progress-bg"><div class="progress-fill" id="progressBar"></div></div>
        <div class="budget-info">
            <span id="budgetStatus">Sin límite fijado</span>
            <span id="budgetRemaining"></span>
        </div>
    </div>

    <div class="card">
        <div class="input-group">
            <input type="number" id="amount" class="input-amount" placeholder="0.00 €" step="0.01" inputmode="decimal">
        </div>

        <div class="categories-grid" id="categoriesGrid"></div>

        <!-- Contenedor dinámico de subcategorías -->
        <div class="subcat-container" id="subcatContainer">
            <span class="subcat-label">Subcategoría:</span>
            <div class="subcat-chips" id="subcatChips"></div>
        </div>

        <div class="row-inputs">
            <input type="text" id="note" class="input-text" placeholder="Nota adicional (opcional)">
            <input type="date" id="date" class="input-date">
        </div>

        <button class="btn-submit" onclick="addExpense()">+ Añadir Gasto</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('list', this)">Últimos Movimientos</div>
        <div class="tab" onclick="switchTab('stats', this)">Por Categoría</div>
    </div>

    <div class="card" id="listView">
        <div id="expensesList"></div>
    </div>

    <div class="card" id="statsView" style="display:none;">
        <div id="categoryStats"></div>
    </div>
</div>

<!-- Modal para añadir o gestionar categorías y subcategorías -->
<div class="modal-overlay" id="catModal">
    <div class="modal-box">
        <div class="modal-title">
            <span>Gestionar Categorías</span>
            <button class="btn-del" onclick="closeCatModal()">×</button>
        </div>
        
        <div style="font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--muted);">Crear nueva categoría:</div>
        <div class="row-inputs" style="margin-bottom: 6px;">
            <input type="text" id="newCatIcon" class="input-text" style="flex: 0 0 60px; text-align: center; font-size: 1.2rem;" value="🏷️" maxlength="2">
            <input type="text" id="newCatName" class="input-text" placeholder="Nombre (ej. Mascotas...)">
        </div>
        <div class="input-group" style="margin-bottom: 10px;">
            <input type="text" id="newCatSubcats" class="input-text" style="width: 100%; font-size: 0.85rem;" placeholder="Subcategorías separadas por comas (opcional)">
        </div>
        <div class="emoji-presets">
            <button type="button" class="emoji-chip" onclick="pickEmoji('🐾')">🐾</button>
            <button type="button" class="emoji-chip" onclick="pickEmoji('🎬')">🎬</button>
            <button type="button" class="emoji-chip" onclick="pickEmoji('💊')">💊</button>
            <button type="button" class="emoji-chip" onclick="pickEmoji('🎁')">🎁</button>
            <button type="button" class="emoji-chip" onclick="pickEmoji('🏠')">🏠</button>
            <button type="button" class="emoji-chip" onclick="pickEmoji('📚')">📚</button>
            <button type="button" class="emoji-chip" onclick="pickEmoji('☕')">☕</button>
            <button type="button" class="emoji-chip" onclick="pickEmoji('🛠️')">🛠️</button>
        </div>
        <div class="modal-actions">
            <button class="btn-submit" style="width
